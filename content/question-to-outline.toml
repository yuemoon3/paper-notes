slug = "question-to-outline"
title = "從一個好奇，走到可以動筆的大綱"
summary = "縮小問題、分開證據與主張，再讓每個段落都知道自己要完成什麼任務。"
category = "寫作練習"
date = "2026-11-16"
minutes = 4
kind = "方法示範"
tags = ["研究提問", "段落結構", "寫作大綱"]
checklist = ["把題目縮小到明確對象、情境與問題。", "替大綱中的每一節標出需要的證據。", "用一段『主張—證據—解釋—限制』試寫。"]

[[sections]]
heading = "好奇可以很大，問題需要有邊界"
paragraphs = ["從一個你真正在意的現象出發，先列出對象、情境、期間與想理解的關係。不是每個欄位都要塞進標題，但你應該知道自己的範圍。", "以純粹的練習題為例，『如何閱讀』可以縮小為『初次接觸某領域的學生，如何用固定欄位整理第一批文獻？』這不是實證結論，而是把問題變得具體的一種方式。"]

[[sections]]
heading = "讓每一節承擔一項任務"
paragraphs = ["先不追求漂亮的章名。用問句寫出各節的工作：為什麼值得討論？既有研究如何回答？我的比較方式是什麼？目前能支持哪些判斷？", "如果某一節只有標題卻找不到需要的證據，就標記『待補資料』。不要讓 AI 用流暢文字填滿尚未完成的推論。"]
bullets = ["背景：讓讀者理解問題及其範圍。", "整理：比較既有說法，而非堆疊摘要。", "討論：將證據連回問題，同時保留限制。"]

[[sections]]
heading = "用一個段落測試你的大綱"
paragraphs = ["選一個最有把握的小主張，依序寫出主張、可核查的證據、你的解釋，以及這個判斷的限制。沒有證據時，先寫成問題或假設。", "讀完後問自己：讀者知道這段想說什麼嗎？證據真的支持這個說法嗎？下一段為什麼接在這裡？把答案補進大綱，再開始擴寫。"]

