slug = "reading-workflow"
title = "讀一篇論文，先找到它的骨架"
summary = "從研究問題、方法到限制，用三輪閱讀把一篇論文整理成自己說得清楚的筆記。"
category = "閱讀方法"
date = "2026-11-16"
minutes = 5
kind = "方法示範"
tags = ["三輪閱讀", "研究問題", "批判思考"]
checklist = ["用一句話寫出作者想回答的問題。", "指出哪一項證據直接支持主要結論。", "寫下至少一個限制，以及你想追問的問題。"]

[[sections]]
heading = "第一輪：先判斷，這篇和我有關嗎？"
paragraphs = ["先看標題、摘要、章節標題與結論，為自己畫出閱讀範圍。此時不用逐句翻譯，也不急著理解所有術語。", "在紙上寫下三個短句：作者在問什麼、用了什麼方式、得到什麼答案。如果其中一個寫不出來，就把它當成第二輪的閱讀目標。"]
bullets = ["研究對象：作者在討論誰或什麼現象？", "研究範圍：時間、地區與情境有哪些界線？", "關聯性：它能幫我理解哪一部分的研究問題？"]

[[sections]]
heading = "第二輪：沿著證據走，而不是沿著螢光筆走"
paragraphs = ["選出與自己的問題最相關的段落，連起『問題 → 方法 → 證據 → 結論』。每做一筆標記，就留下一句自己的說明。", "例如，不只寫『這張表很重要』，而是寫『這張表比較兩組的差異，但我還要確認兩組是否有其他不同』。這是閱讀練習的示範，不代表任何特定研究的發現。"]
bullets = ["方法能回答作者提出的問題嗎？", "主要結論依賴哪些假設？", "哪些內容是觀察結果，哪些是作者的解釋？"]

[[sections]]
heading = "第三輪：合起文章，用自己的話重建"
paragraphs = ["關掉原文，寫一段短摘要，再回頭核對有沒有遺漏前提。這一步不是測記憶，而是檢查自己能否說清楚推論的過程。", "最後把筆記分成『原文說了什麼』『我的理解』『還不確定的地方』。保留頁碼與書目，之後寫作時才能回到證據。"]

