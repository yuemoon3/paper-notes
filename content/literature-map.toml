slug = "literature-map"
title = "讓文獻互相對話：建立你的整理地圖"
summary = "把逐篇摘要變成可以比較的線索，找到共識、差異，以及值得繼續追問的空白。"
category = "研究整理"
date = "2026-11-16"
minutes = 4
kind = "方法示範"
tags = ["文獻整理", "比較矩陣", "研究缺口"]
checklist = ["替目前的文獻訂出一致的比較欄位。", "找出兩篇文獻相同與不同的研究條件。", "將一個暫時的缺口改寫成可查證的問題。"]

[[sections]]
heading = "先定義欄位，再整理文獻"
paragraphs = ["如果每篇筆記格式不同，回頭比較就需要重新閱讀。先建立固定欄位：研究問題、研究對象、方法、主要結果、限制與來源。", "先用三篇文章試填，遇到無法比較的欄位就調整。空白可以寫『原文未說明』，不要為了讓表格完整而補上猜測。"]
bullets = ["研究問題：比較的是否真的是同一件事？", "研究條件：時間、樣本與定義是否一致？", "證據位置：頁碼、圖表編號或段落位置。"]

[[sections]]
heading = "從逐篇排列，改成依問題分組"
paragraphs = ["試著用一個問題作為小標題，再把能回答它的文獻放在一起。你可能得到『如何定義現象』『如何衡量』『哪些條件下不同』等群組。", "兩篇研究看起來矛盾時，先核對定義、樣本與方法。差異不一定代表其中一篇錯了，也可能代表它們回答的問題本來就不一樣。"]

[[sections]]
heading = "把空白變成下一步，而不是口號"
paragraphs = ["『很少人研究』需要搜尋證據支持，不能只靠自己目前找到的幾篇文獻下結論。先把它寫成暫時判斷，再記錄搜尋範圍與尚未確認的來源。", "更可執行的寫法是：『在目前檢視的資料中，某個研究條件還沒有被清楚比較；接下來要擴大搜尋並確認是否已有答案。』這讓缺口成為行動起點。"]

